<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Obstacle Course</title>
<style>
:root{
  --navy:#071a44; --blue:#2563eb; --sky:#38bdf8; --yellow:#facc15; --red:#ef4444;
  --green:#22c55e; --purple:#7c3aed; --orange:#f97316; --ink:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); min-height:100vh; padding:18px;
  background:
    radial-gradient(circle at 8% 10%,rgba(250,204,21,.42) 0 16%,transparent 32%),
    radial-gradient(circle at 92% 8%,rgba(37,99,235,.30) 0 18%,transparent 36%),
    radial-gradient(circle at 8% 88%,rgba(34,197,94,.24) 0 18%,transparent 36%),
    radial-gradient(circle at 92% 86%,rgba(239,68,68,.26) 0 20%,transparent 38%),
    linear-gradient(135deg,#fffaf0 0%,#f8fafc 48%,#eff6ff 100%);
}
.page{max-width:1120px;margin:0 auto}
header{text-align:center;margin-bottom:16px}
.logo{
  display:inline-block; position:relative; background:white; border:6px solid var(--navy); border-radius:38px;
  box-shadow:8px 8px 0 var(--navy); padding:12px 22px 16px; animation:logoBounce 2.6s ease-in-out infinite;
}
@keyframes logoBounce{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-4px)}}
.runner-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.runner{font-size:clamp(2rem,5vw,4rem);filter:drop-shadow(3px 3px 0 rgba(7,26,68,.22))}
.runner-left{animation:runLeft 1.1s ease-in-out infinite}.runner-right{animation:runRight 1.1s ease-in-out infinite}
@keyframes runLeft{0%,100%{transform:translateX(-4px) translateY(0) rotate(-5deg)}50%{transform:translateX(5px) translateY(-5px) rotate(4deg)}}
@keyframes runRight{0%,100%{transform:translateX(4px) translateY(0) rotate(5deg)}50%{transform:translateX(-5px) translateY(-5px) rotate(-4deg)}}
.speed-cloud{font-size:clamp(1.4rem,4vw,3rem);animation:puff 1.4s ease-in-out infinite}
@keyframes puff{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.bolt{font-size:clamp(1.8rem,5vw,3.6rem);animation:flash .8s ease-in-out infinite}
@keyframes flash{0%,100%{transform:scale(1) rotate(-8deg);filter:brightness(1)}50%{transform:scale(1.22) rotate(8deg);filter:brightness(1.4)}}
h1{margin:0;font-size:clamp(2.2rem,7vw,5.2rem);line-height:.9;letter-spacing:-2px}
.rainbow-word span{display:inline-block;color:var(--c);transform:rotate(var(--r));text-shadow:3px 3px 0 white,-2px 2px 0 white,4px 6px 0 rgba(7,26,68,.22)}
.typer-line{display:block;color:var(--navy);font-size:.86em;letter-spacing:-3px;text-shadow:0 6px 0 rgba(7,26,68,.12)}
.sparkle-row{margin-top:4px;color:var(--yellow);font-size:clamp(1.3rem,4vw,2.4rem);letter-spacing:14px;animation:sparkleSpin 1.8s ease-in-out infinite}
@keyframes sparkleSpin{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.subtitle{display:inline-block;margin-top:14px;background:white;border:3px solid #bfdbfe;border-radius:999px;padding:8px 16px;font-weight:900;color:#334155}
.card{background:rgba(255,255,255,.96);border:4px solid #dbeafe;border-radius:28px;padding:18px;box-shadow:0 18px 40px rgba(15,23,42,.14)}
.screen{display:none}.screen.active{display:block}
.instructions{text-align:center;font-size:1.05rem;font-weight:800;color:#475569;line-height:1.45;margin:8px auto 16px;max-width:840px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.mode{width:100%;border:4px solid #bfdbfe;background:white;border-radius:24px;min-height:150px;padding:18px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 0 #bfdbfe;transition:.12s;text-align:center}
.mode:active,.mode:hover{transform:translateY(4px);box-shadow:0 4px 0 #bfdbfe;background:#fef3c7}
.mode h2{margin:0 0 8px;font-size:1.8rem;color:var(--navy)} .mode p{margin:6px 0;font-weight:800;color:#475569}
.time-chip{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-weight:900}
.achievements{margin-top:18px;background:#f8fafc;border:3px solid #e2e8f0;border-radius:22px;padding:14px}
.achievements h3{margin:0 0 10px;color:var(--navy)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:#e2e8f0;color:#64748b;border-radius:999px;padding:8px 12px;font-weight:900}
.badge.unlocked{background:#fef3c7;color:#78350f;border:2px solid #facc15}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#eff6ff;border:3px solid #bfdbfe;border-radius:18px;padding:10px 8px;text-align:center;font-weight:900}
.stat small{display:block;color:#64748b;font-size:.8rem}.stat span{display:block;color:#1d4ed8;font-size:1.25rem;margin-top:2px}
.scene-wrap{height:390px;border:5px solid var(--navy);border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(#8bd3ff 0 38%,#b7f7bf 38% 100%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.cloud{position:absolute;background:white;border-radius:999px;opacity:.9}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}
.c1{left:6%;top:8%;width:120px;height:38px}.c1:before{width:52px;height:52px;left:20px;top:-24px}.c1:after{width:62px;height:62px;right:14px;top:-32px}
.c2{right:7%;top:12%;width:110px;height:34px}.c2:before{width:46px;height:46px;left:18px;top:-20px}.c2:after{width:54px;height:54px;right:14px;top:-28px}
.scene{position:absolute;inset:0;perspective:700px;overflow:hidden}
.track{position:absolute;left:50%;bottom:-70px;width:72%;height:78%;transform:translateX(-50%) rotateX(62deg);transform-origin:bottom;background:repeating-linear-gradient(90deg,transparent 0 48%,rgba(255,255,255,.55) 48% 52%,transparent 52% 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 18px,transparent 18px 70px),linear-gradient(90deg,#6b7280,#9ca3af,#6b7280);border-left:9px solid #fef3c7;border-right:9px solid #fef3c7;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);animation:roadMove .55s linear infinite}
@keyframes roadMove{from{background-position:0 0,0 0,0 0}to{background-position:0 0,0 70px,0 0}}
.finish{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:4rem;opacity:.55;z-index:2}
.player{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:6;font-size:4.8rem;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));transition:.22s}
.player.jump{bottom:96px;transform:translateX(-50%) rotate(-8deg) scale(1.08)}
.obstacle{position:absolute;left:50%;top:40%;width:min(500px,74%);min-height:126px;transform:translate(-50%,-50%) scale(1);background:linear-gradient(135deg,#ef4444,#f97316);border:5px solid var(--navy);border-radius:24px;z-index:5;box-shadow:0 12px 0 rgba(7,26,68,.35);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;text-align:center;padding:16px;transition:.25s}
.obstacle.cleared{transform:translate(-50%,-50%) scale(.1) rotate(22deg);opacity:0}
.obstacle-icon{font-size:clamp(2.8rem,7vw,5rem);filter:drop-shadow(3px 4px 0 rgba(7,26,68,.35))}
.obstacle-word{font-size:clamp(2rem,7vw,4.8rem);color:white;font-weight:900;letter-spacing:2px;text-shadow:3px 3px 0 var(--navy);overflow-wrap:anywhere}
.obstacle-name{grid-column:1/3;color:#fff7ed;font-weight:900;font-size:.9rem;text-transform:uppercase;letter-spacing:2px;margin-top:-6px}
.controls{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
#typingInput{width:100%;font-size:1.8rem;text-align:center;font-weight:900;border:4px solid #bfdbfe;border-radius:22px;padding:14px 12px;outline:none;background:white}
#typingInput:focus{border-color:var(--blue);box-shadow:0 0 0 5px rgba(37,99,235,.15)}#typingInput.wrong{border-color:#ef4444;background:#fff1f2}#typingInput.correct{border-color:#22c55e;background:#f0fdf4}
.btn{border:0;border-radius:999px;padding:15px 22px;font-size:1rem;font-weight:900;cursor:pointer;touch-action:manipulation}.secondary{background:#e2e8f0;color:#334155}.primary{background:#ef4444;color:white}
.progress-wrap{margin-top:12px;height:22px;background:#e2e8f0;border:3px solid #cbd5e1;border-radius:999px;overflow:hidden}
#progressBar{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:.25s}
.result{text-align:center;background:linear-gradient(135deg,#ecfeff,#f5f3ff);border:4px solid #a5f3fc;border-radius:28px;padding:24px}.result h2{margin:0 0 12px;color:var(--purple);font-size:clamp(2.2rem,7vw,4.5rem)}.result p{font-size:1.25rem;font-weight:900;color:#475569}
.result-actions{margin-top:18px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
@media(max-width:760px){body{padding:10px}.card{padding:12px;border-radius:22px}.logo{padding:10px 12px 14px;border-width:4px;box-shadow:5px 5px 0 var(--navy);border-radius:28px}h1{font-size:clamp(2rem,12vw,3.4rem)}.runner-row{gap:5px}.sparkle-row{letter-spacing:8px}.subtitle{font-size:.92rem}.mode-grid{grid-template-columns:1fr;gap:10px}.mode{min-height:108px;padding:14px}.mode h2{font-size:1.45rem}.hud{grid-template-columns:repeat(2,1fr)}.scene-wrap{height:330px;border-radius:22px}.player{font-size:4rem;bottom:35px}.obstacle{width:84%;min-height:110px;gap:8px}.controls{grid-template-columns:1fr}.btn{width:100%}#typingInput{font-size:1.55rem}}
@media(max-width:420px){.hud{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}.stat small,.stat span{margin:0}.scene-wrap{height:285px}.obstacle{grid-template-columns:1fr}.obstacle-name{grid-column:1}.obstacle-icon{font-size:3rem}.obstacle-word{font-size:2.4rem}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="logo">
    <div class="runner-row"><span class="runner runner-left">🏃‍♂️</span><span class="speed-cloud">💨</span><span class="bolt">⚡</span><span class="speed-cloud">💨</span><span class="runner runner-right">🏃‍♀️</span></div>
    <h1><span class="rainbow-word"><span style="--c:#ef4444;--r:-4deg;">O</span><span style="--c:#f97316;--r:3deg;">B</span><span style="--c:#facc15;--r:-2deg;">S</span><span style="--c:#22c55e;--r:2deg;">T</span><span style="--c:#38bdf8;--r:-3deg;">A</span><span style="--c:#2563eb;--r:3deg;">C</span><span style="--c:#7c3aed;--r:-2deg;">L</span><span style="--c:#ec4899;--r:2deg;">E</span></span><span class="typer-line">COURSE</span></h1>
    <div class="sparkle-row"><span>⭐</span><span>⚡</span><span>⭐</span></div>
  </div>
  <div class="subtitle">Type the word. Clear the obstacle. Beat the clock!</div>
</header>

<main class="card">
  <section id="menuScreen" class="screen active">
    <p class="instructions">Choose a difficulty to start. There are 20 obstacles. Type each word before time runs out.</p>
    <div class="mode-grid">
      <button class="mode" onclick="startGame('easy')"><h2>Easy</h2><p>2–3 letter words</p><span class="time-chip">90 seconds</span></button>
      <button class="mode" onclick="startGame('medium')"><h2>Medium</h2><p>4–5 letter words</p><span class="time-chip">110 seconds</span></button>
      <button class="mode" onclick="startGame('hard')"><h2>Hard</h2><p>6–10 letter words</p><span class="time-chip">130 seconds</span></button>
    </div>
    <div class="achievements">
      <h3>Achievements</h3>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="hud">
      <div class="stat"><small>Time left</small><span id="timer">90s</span></div>
      <div class="stat"><small>Obstacle</small><span id="wordCount">1 / 20</span></div>
      <div class="stat"><small>Mistakes</small><span id="mistakes">0</span></div>
      <div class="stat"><small>Difficulty</small><span id="difficultyLabel">Easy</span></div>
    </div>
    <div class="scene-wrap">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="scene">
        <div class="finish">🏁</div><div class="track"></div>
        <div class="obstacle" id="obstacle"><div class="obstacle-icon" id="obstacleIcon">🧱</div><div class="obstacle-word" id="targetWord">go</div><div class="obstacle-name" id="obstacleName">Wall</div></div>
        <div class="player" id="player">🏃‍♀️</div>
      </div>
    </div>
    <div class="controls"><input id="typingInput" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the word here"><button class="btn secondary" onclick="backToMenu()">Quit</button></div>
    <div class="progress-wrap"><div id="progressBar"></div></div>
  </section>

  <section id="resultScreen" class="screen">
    <div class="result">
      <h2 id="resultTitle">Finished!</h2>
      <p id="resultText"></p>
      <p id="bestText"></p>
      <p id="achievementText"></p>
      <div class="result-actions"><button class="btn primary" onclick="startGame(currentDifficulty)">Play again</button><button class="btn secondary" onclick="backToMenu()">Choose difficulty</button></div>
    </div>
  </section>
</main>
</div>

<script>
var WORDS={
easy:["go","up","in","on","at","to","it","is","we","me","he","as","am","an","be","by","do","if","no","of","or","so","us","cat","dog","sun","run","hop","map","red","box","bug","mud","jam","pen","cup","hat","fox","pig","hen","log","web","zip","bat","cow","owl","ant","car","bus","bed","bag","egg","fan","gum","hug","ice","jar","key","leg","net","pot","rug","toy","van","wig","yak","zoo","bun","cap","dig","fun","jet","kit","lap","mix","nap","pin","ram","sit","tap","win","yes","pop"],
medium:["frog","duck","bear","fish","bird","lion","goat","milk","cake","book","star","moon","tree","ship","sock","ball","jump","play","read","type","fast","slow","blue","pink","gold","rain","wind","snow","fire","king","ring","drum","bell","corn","pear","plum","bean","rice","sand","wave","road","park","door","desk","lamp","clap","spin","grin","flip","skip","bump","zoom","yell","joke","quiz","maze","word","line","page","kind","wild","apple","tiger","zebra","snake","horse","mouse","panda","eagle","shark","whale","chair","table","happy","silly","funny","quick","brave","green","black","white","brown","cloud","storm","river","beach","music","drums","pizza","toast","grape","melon","lemon","mango","chips","sauce","dance","skate","slide","smile","laugh","magic","robot","alien","crown","train","plane","space","light","night","world","dream","story","words","timer"],
hard:["animal","answer","around","artist","autumn","banana","basket","battle","beauty","before","behind","better","bottle","bottom","branch","bridge","bright","broken","bucket","butter","button","camera","candle","castle","centre","change","cheese","choice","circle","clever","colour","common","corner","cotton","course","danger","dinner","doctor","double","dragon","drawer","during","effect","effort","eleven","enough","escape","family","famous","father","flower","forest","forgot","future","garden","gentle","golden","ground","hammer","handle","happen","health","hidden","hockey","honest","island","jacket","jungle","kitten","ladder","letter","little","lizard","locker","market","medal","member","middle","minute","mirror","monkey","mother","motion","muscle","nation","nature","noodle","number","object","orange","palace","parent","pencil","people","person","pickle","pirate","planet","pocket","potato","pretty","purple","rabbit","reader","reason","record","result","rocket","safety","school","season","second","secret","shadow","silver","sister","soccer","speech","spider","square","stable","stream","strong","summer","supper","teacher","tennis","ticket","tomato","travel","tunnel","turtle","twelve","twenty","valley","velvet","visitor","wallet","window","winter","wonder","writer","yellow","library","science","weather","journey","blanket","picture","holiday","monster","kangaroo","treasure","adventure","wonderful","important"]
};
var OBSTACLES=[["🧱","Wall"],["🔥","Lava pit"],["🌊","Water jump"],["🪵","Log bridge"],["🕳️","Mud pit"],["⚡","Electric fence"],["🪨","Boulder"],["🌉","Bridge"],["🧗","Climb wall"],["🏁","Final gate"]];
var TIMES={easy:90,medium:110,hard:130},LABELS={easy:"Easy",medium:"Medium",hard:"Hard"};
var ACH=[["easy","Bronze Runner"],["medium","Silver Runner"],["hard","Gold Runner"],["zero","Lightning Fingers"],["fast","Speed Champion"]];
var currentDifficulty="easy",currentWords=[],currentIndex=0,mistakes=0,timeLeft=90,timerInterval=null,gameOver=false;

function showScreen(id){["menuScreen","gameScreen","resultScreen"].forEach(function(s){document.getElementById(s).classList.remove("active")});document.getElementById(id).classList.add("active")}
function shuffle(arr){var copy=arr.slice();for(var i=copy.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=copy[i];copy[i]=copy[j];copy[j]=t}return copy}
function startGame(difficulty){
 currentDifficulty=difficulty;currentWords=shuffle(WORDS[difficulty]).slice(0,20);currentIndex=0;mistakes=0;timeLeft=TIMES[difficulty];gameOver=false;
 document.getElementById("difficultyLabel").textContent=LABELS[difficulty];document.getElementById("mistakes").textContent="0";document.getElementById("timer").textContent=timeLeft+"s";document.getElementById("timer").style.color="#1d4ed8";document.getElementById("typingInput").value="";document.getElementById("typingInput").className="";document.getElementById("progressBar").style.width="0%";document.getElementById("obstacle").classList.remove("cleared");
 showScreen("gameScreen");updateWord();clearInterval(timerInterval);timerInterval=setInterval(tick,1000);setTimeout(function(){document.getElementById("typingInput").focus()},150)
}
function tick(){if(gameOver)return;timeLeft--;document.getElementById("timer").textContent=timeLeft+"s";document.getElementById("timer").style.color=timeLeft<=10?"#ef4444":"#1d4ed8";if(timeLeft<=0)endGame(false)}
function updateWord(){
 var obs=OBSTACLES[currentIndex%OBSTACLES.length];document.getElementById("obstacleIcon").textContent=obs[0];document.getElementById("obstacleName").textContent=obs[1];
 document.getElementById("targetWord").textContent=currentWords[currentIndex];document.getElementById("wordCount").textContent=(currentIndex+1)+" / 20";document.getElementById("progressBar").style.width=((currentIndex/20)*100)+"%";
 document.getElementById("player").textContent=currentIndex%2===0?"🏃‍♀️":"🏃‍♂️"
}
function checkInput(){if(gameOver)return;var input=document.getElementById("typingInput");var typed=input.value.trim().toLowerCase();var correct=currentWords[currentIndex].toLowerCase();if(typed===correct){input.className="correct";clearObstacle()}else if(typed.length>0&&correct.indexOf(typed)!==0){input.className="wrong"}else{input.className=""}}
function submitWord(){if(gameOver)return;var input=document.getElementById("typingInput");var typed=input.value.trim().toLowerCase();var correct=currentWords[currentIndex].toLowerCase();if(!typed)return;if(typed===correct){input.className="correct";clearObstacle()}else{mistakes++;document.getElementById("mistakes").textContent=mistakes;input.className="wrong";setTimeout(function(){input.className=""},180)}}
function clearObstacle(){
 var player=document.getElementById("player"),obstacle=document.getElementById("obstacle"),input=document.getElementById("typingInput");obstacle.classList.add("cleared");player.classList.add("jump");
 setTimeout(function(){currentIndex++;if(currentIndex>=20){endGame(true);return}input.value="";input.className="";player.classList.remove("jump");obstacle.classList.remove("cleared");updateWord()},350)
}
function unlock(key){localStorage.setItem("ocAchievement_"+key,"yes")}
function has(key){return localStorage.getItem("ocAchievement_"+key)==="yes"}
function renderBadges(){var box=document.getElementById("badges");if(!box)return;box.innerHTML="";ACH.forEach(function(a){var b=document.createElement("span");b.className="badge "+(has(a[0])?"unlocked":"");b.textContent=(has(a[0])?"🏆 ":"🔒 ")+a[1];box.appendChild(b)})}
function endGame(won){
 gameOver=true;clearInterval(timerInterval);document.getElementById("progressBar").style.width=won?"100%":((currentIndex/20)*100)+"%";
 var used=TIMES[currentDifficulty]-timeLeft,title=won?"Course complete!":"Time's up!",text=won?"You cleared all 20 obstacles in "+used+" seconds with "+mistakes+" mistake"+(mistakes===1?"":"s")+".":"You cleared "+currentIndex+" out of 20 obstacles. Try again!";
 var key="obstacleCourseBest_"+currentDifficulty,oldBest=Number(localStorage.getItem(key)||"0"),bestMessage="",achievementMessage="";
 if(won){if(oldBest===0||used<oldBest){localStorage.setItem(key,used);bestMessage="New personal best for "+LABELS[currentDifficulty]+"!"}else{bestMessage="Personal best for "+LABELS[currentDifficulty]+": "+oldBest+" seconds."}
  unlock(currentDifficulty);achievementMessage+="Unlocked: "+LABELS[currentDifficulty]+" Runner! ";
  if(mistakes===0){unlock("zero");achievementMessage+="Unlocked: Lightning Fingers! "}
  if(currentDifficulty==="hard"&&timeLeft>=30){unlock("fast");achievementMessage+="Unlocked: Speed Champion! "}
 }
 document.getElementById("resultTitle").textContent=title;document.getElementById("resultText").textContent=text;document.getElementById("bestText").textContent=bestMessage;document.getElementById("achievementText").textContent=achievementMessage;renderBadges();showScreen("resultScreen")
}
function backToMenu(){clearInterval(timerInterval);gameOver=true;renderBadges();showScreen("menuScreen")}
document.addEventListener("DOMContentLoaded",function(){renderBadges();var input=document.getElementById("typingInput");input.addEventListener("input",checkInput);input.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();submitWord()}})})
</script>
</body>
</html>
